<font size ="8">
 Unsubscribe from recieving emails<br></font>Watch the video for instructions on how to unsubscribe

 <video 
    id="myVideo"
    width="640" 
    height="360" 
    autoplay
    controls 
    controlsList="nodownload noplaybackrate"
    disablePictureInPicture
>
    <source src="video.mp4" type="video/mp4">
    Sorry but your browser couldn't display this video 🙁.
</video><p id="message" style"display: none;">
    Just Kidding! you can't unsubscribe because this is sent by a human directly to you<br></br> GET RICKROLLED
</p>
 <script>
const video = document.getElementById("myVideo");
const message = document.getElementById("message");

let timer;

video.addEventListener("play", () => {
    timer = setTimeout(() => {
        message.style.display = "block";
    }, 3000); // 3000 milliseconds = 3 seconds
});

video.addEventListener("pause", () => {
    clearTimeout(timer);      // Cancel the timer if paused before 3 seconds
    message.style.display = "none";
});
</script>
